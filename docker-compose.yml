services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      server:
        condition: service_healthy
